<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <radialGradient id="waxGold" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FFF5D1"/>
      <stop offset="25%" stop-color="#E5C77A"/>
      <stop offset="60%" stop-color="#B8860B"/>
      <stop offset="90%" stop-color="#7B5604"/>
      <stop offset="100%" stop-color="#4E3602"/>
    </radialGradient>
    <filter id="waxShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#2D1E02" flood-opacity="0.5"/>
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#FFEBB0" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Wax seal irregular scalloped body -->
  <circle cx="50" cy="50" r="46" fill="url(#waxGold)" filter="url(#waxShadow)"/>
  
  <!-- Inner stamped rim -->
  <circle cx="50" cy="50" r="38" fill="none" stroke="#684705" stroke-width="1.5" stroke-opacity="0.6"/>
  <circle cx="50" cy="50" r="35" fill="none" stroke="#FFE9A8" stroke-width="1" stroke-opacity="0.8" stroke-dasharray="2 2"/>

  <!-- Centered "60" and "ЖАС" or ornamentation -->
  <g text-anchor="middle" font-family="'Cinzel', 'Playfair Display', Georgia, serif">
    <text x="50" y="52" font-size="24" font-weight="bold" fill="#FFEAA5" filter="drop-shadow(0 1px 1px #422C02)">60</text>
    <text x="50" y="66" font-size="8" font-weight="600" letter-spacing="2" fill="#FFF2C6" filter="drop-shadow(0 1px 1px #422C02)">ЖАС</text>
  </g>
</svg>
