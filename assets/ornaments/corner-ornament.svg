<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C5A059"/>
      <stop offset="35%" stop-color="#E5C77A"/>
      <stop offset="50%" stop-color="#FFF3C4"/>
      <stop offset="65%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#997526"/>
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#805d15" flood-opacity="0.3"/>
    </filter>
  </defs>
  <g fill="none" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#goldGlow)">
    <!-- Corner bracket outer line -->
    <path d="M 8 100 L 8 16 Q 8 8 16 8 L 100 8" />
    <!-- Secondary inner accent line -->
    <path d="M 18 80 L 18 24 Q 18 18 24 18 L 80 18" stroke-width="1.2" stroke-dasharray="3 3"/>
    <!-- Traditional Kazakh horn spiral (Qoshqar muiiz) -->
    <path d="M 28 55 C 28 35 40 28 52 28 C 65 28 72 38 68 50 C 65 59 52 62 48 55 C 44 48 48 40 56 42" stroke-width="2.2" />
    <path d="M 55 28 C 35 28 28 40 28 52 C 28 65 38 72 50 68 C 59 65 62 52 55 48 C 48 44 40 48 42 56" stroke-width="2.2" />
    <!-- Corner flourish dot -->
    <circle cx="16" cy="16" r="3" fill="url(#goldGrad)" stroke="none"/>
  </g>
</svg>
