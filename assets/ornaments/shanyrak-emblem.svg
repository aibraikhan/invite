<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGradCircle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#BF953F"/>
      <stop offset="25%" stop-color="#FCF6BA"/>
      <stop offset="50%" stop-color="#B38728"/>
      <stop offset="75%" stop-color="#FBF5B7"/>
      <stop offset="100%" stop-color="#AA771C"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF8E7" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#F5E6CA" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#EBD5B0" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#5C4010" flood-opacity="0.35"/>
    </filter>
  </defs>

  <circle cx="100" cy="100" r="95" fill="url(#sunGlow)"/>
  
  <!-- Outer ornamental rim -->
  <circle cx="100" cy="100" r="90" fill="none" stroke="url(#goldGradCircle)" stroke-width="2.5" filter="url(#shadow)"/>
  <circle cx="100" cy="100" r="84" fill="none" stroke="url(#goldGradCircle)" stroke-width="1" stroke-dasharray="2 4"/>

  <!-- Shanyrak center circle and cross beams (Kuldireush) -->
  <g stroke="url(#goldGradCircle)" stroke-linecap="round" fill="none" filter="url(#shadow)">
    <!-- Central Rim -->
    <circle cx="100" cy="100" r="48" stroke-width="3.5"/>
    <circle cx="100" cy="100" r="44" stroke-width="1" stroke-dasharray="3 3"/>
    <circle cx="100" cy="100" r="14" stroke-width="2.5" fill="#FCF6BA" fill-opacity="0.3"/>

    <!-- Arc crossbeams (Kuldireush) -->
    <path d="M 64 74 C 76 86 124 86 136 74" stroke-width="2"/>
    <path d="M 54 100 C 72 110 128 110 146 100" stroke-width="2"/>
    <path d="M 64 126 C 76 114 124 114 136 126" stroke-width="2"/>

    <path d="M 74 64 C 86 76 86 124 74 136" stroke-width="2"/>
    <path d="M 100 54 C 110 72 110 128 100 146" stroke-width="2"/>
    <path d="M 126 64 C 114 76 114 124 126 136" stroke-width="2"/>
  </g>

  <!-- 4 Corner Horn Patterns around the Shanyrak -->
  <g fill="none" stroke="url(#goldGradCircle)" stroke-width="2" stroke-linecap="round">
    <!-- Top -->
    <path d="M 92 22 C 92 12 100 8 108 12 C 112 15 110 20 105 20 C 100 20 98 16 100 13" />
    <path d="M 108 22 C 108 12 100 8 92 12 C 88 15 90 20 95 20 C 100 20 102 16 100 13" />
    <!-- Bottom -->
    <path d="M 92 178 C 92 188 100 192 108 188 C 112 185 110 180 105 180 C 100 180 98 184 100 187" />
    <path d="M 108 178 C 108 188 100 192 92 188 C 88 185 90 180 95 180 C 100 180 102 184 100 187" />
    <!-- Left -->
    <path d="M 22 92 C 12 92 8 100 12 108 C 15 112 20 110 20 105 C 20 100 16 98 13 100" />
    <path d="M 22 108 C 12 108 8 100 12 92 C 15 88 20 90 20 95 C 20 100 16 102 13 100" />
    <!-- Right -->
    <path d="M 178 92 C 188 92 192 100 188 108 C 185 112 180 110 180 105 C 180 100 184 98 187 100" />
    <path d="M 178 108 C 188 108 192 100 188 92 C 185 88 180 90 180 95 C 180 100 184 102 187 100" />
  </g>
</svg>
